<svg viewBox="0 0 560 920" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Almanac theme — Home screen (illustrative mockup)</title>

  <rect x="0" y="0" width="560" height="920" fill="#f4f4f4"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#666">
    Illustrative UI mockup of the Almanac theme — not an actual device photo
  </text>

  <!-- Device bezel -->
  <rect x="20" y="40" width="520" height="840" rx="26" fill="#161616"/>
  <circle cx="280" cy="60" r="3" fill="#3a3a3a"/>

  <!-- Screen: 480x800 portrait. Every rect below is MenuLayout's own geometry
       for a 7-tile composition with a recent book, offset by this origin.
       Constants: kHomeMastheadHeight=112, kHomeTierGap=12,
       kHomeWideTileHeight=92, kHomeGridTileHeight=128, kHomeGridColumnGap=14,
       kHomeGridColumns=2; AlmanacMetrics contentSidePadding=16,
       buttonHintsHeight=48. -->
  <rect x="40" y="60" width="480" height="800" fill="#ffffff"/>

  <!-- Masthead: full-bleed black brand bar carrying the mark and wordmark.
       drawHomeMasthead fills the bar, blits the 96px mark at
       contentSidePadding, then sets the wordmark one padding beyond it. -->
  <rect x="40" y="60" width="480" height="112" fill="#000000"/>
  <!-- The mark, 96px. At 64 its bezel ring thins to 1px and stair-steps on a
       1-bit panel; at 96 the ring lands at 2px and reads as a circle. -->
  <g transform="translate(56,68)" stroke="#ffffff" fill="none">
    <circle cx="48" cy="48" r="45" stroke-width="2"/>
    <circle cx="48" cy="48" r="34" stroke-width="1"/>
    <g stroke-width="2">
      <path d="M 48 6 L 48 18"/>
      <path d="M 48 78 L 48 90"/>
      <path d="M 6 48 L 18 48"/>
      <path d="M 78 48 L 90 48"/>
    </g>
    <!-- four inter-cardinal ticks -->
    <g stroke-width="1">
      <path d="M 18 18 L 26 26"/>
      <path d="M 78 18 L 70 26"/>
      <path d="M 18 78 L 26 70"/>
      <path d="M 78 78 L 70 70"/>
    </g>
    <path d="M 48 22 L 58 60 L 48 54 L 38 60 Z" fill="#ffffff" stroke="none"/>
  </g>
  <text x="168" y="122" font-size="17" font-weight="bold" fill="#ffffff">Almanac</text>
  <text x="504" y="122" text-anchor="end" font-size="14" fill="#ffffff">82%</text>

  <!-- Continue Reading: the leading wide tile, present only when a recent book
       exists (homeContinueReadingInMenu is true for this theme). -->
  <rect x="56" y="184" width="448" height="92" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="76" y="222" font-size="16" fill="#000000">Continue Reading</text>
  <text x="76" y="248" font-size="13" fill="#444444">The Worst Journey in the World — 41%</text>

  <!-- Grid tier: 2 columns of 128px tiles, centred in the region between the
       masthead tier and the Settings tier. With five grid tiles the block
       height (3*128 + 2*12 = 408) exactly fills the region, so slack is 0. -->
  <g font-size="16" text-anchor="middle">
    <rect x="56"  y="288" width="217" height="128" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="164" y="358" fill="#000000">Browse Files</text>

    <rect x="287" y="288" width="217" height="128" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="395" y="358" fill="#000000">Recent Books</text>

    <rect x="56"  y="428" width="217" height="128" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="164" y="498" fill="#000000">File Transfer</text>

    <!-- Selected. Two-level emphasis: filled black tile plus a heavier stroke
         offset outside it with a 1px gap, so both levels stay legible in 1 bit. -->
    <rect x="287" y="428" width="217" height="128" fill="#000000"/>
    <rect x="284" y="425" width="223" height="134" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="395" y="498" fill="#ffffff">Nearby Flights</text>

    <!-- A lone tile in the final row spans full width rather than leaving a gap. -->
    <rect x="56" y="568" width="448" height="128" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="280" y="638" fill="#000000">2048</text>
  </g>

  <!-- Settings: the trailing wide tile, anchored a tier gap above the hints bar
       so the grid always has a fixed floor. -->
  <rect x="56" y="708" width="448" height="92" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="280" y="760" text-anchor="middle" font-size="16" fill="#000000">Settings</text>

  <!-- Button-hints footer -->
  <rect x="40" y="812" width="480" height="48" fill="#000000"/>
  <text x="180" y="842" text-anchor="middle" font-size="13" fill="#ffffff">SELECT</text>
  <text x="300" y="842" text-anchor="middle" font-size="13" fill="#ffffff">UP</text>
  <text x="420" y="842" text-anchor="middle" font-size="13" fill="#ffffff">DOWN</text>
</svg>
