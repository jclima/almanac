name: Compile Release
on:
  push:
    tags:
      # Almanac's own tags only. The repository also carries CrossPoint's
      # inherited tags (0.4.0 - 1.5.0); this pattern keeps a stray or
      # re-pushed tag from publishing a public release. It is also the shape
      # OtaUpdater expects -- see lib/Version/SemVer.h.
      - 'almanac-v*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Before the ~10-minute build, so a forgotten bump fails in seconds.
      # The tag is the OTA update signal, so a release whose binary reports an
      # older version than its tag would offer every device an endless update
      # to a firmware that never satisfies the check.
      - name: Verify tag matches platformio.ini version
        id: version
        run: |
          set -euo pipefail
          ini_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' platformio.ini | head -1)"
          tag_version="${GITHUB_REF_NAME#almanac-v}"
          echo "platformio.ini: ${ini_version} / tag: ${tag_version}"
          if [ "$ini_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match [almanac] version ${ini_version} in platformio.ini"
            exit 1
          fi
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build Almanac
        run: pio run -e gh_release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Almanac-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin

      # Notes live in the repository so they are reviewed with the change that
      # earns them, rather than typed into the web UI at tag time. Without a
      # file for this tag the release still publishes, with GitHub's generated
      # commit summary as its body.
      - name: Locate release notes
        id: notes
        run: |
          set -euo pipefail
          path="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$path" ]; then
            echo "path=${path}" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ${path}; falling back to generated notes"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      # firmware.bin must keep that exact asset name: OtaUpdater picks the
      # download URL out of the release JSON by matching it (see
      # ReleaseJsonParser). Renaming the asset silently breaks OTA.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Almanac v${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          fail_on_unmatched_files: true
          files: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
